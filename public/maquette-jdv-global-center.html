function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function navRender(){const r=roles[activeRole];document.getElementById('nav').innerHTML=r.nav.map(([label,ico,id])=>'<button class="'+(activePage===id?'active':'')+'" onclick="go(\''+id+'\')"><span class="ico">'+ico+'</span>'+esc(label)+'</button>').join('');document.getElementById('roleCrumb').textContent=r.short;document.getElementById('avatar').textContent=r.avatar}
function statusTag(s){let cl=/en cours|attente|relancer|faible|ouverte|traiter|contrôler|négociation|planifier|payer|retard|préparer/i.test(s)?'warn':/actif|confirmé|payée|validée|terminé|disponible|résolu|approuvée|reçu|vérifiée/i.test(s)?'':'info';return '<span class="status '+cl+'">'+esc(s)+'</span>'}
function dashboard(){const r=roles[activeRole];return '<div class="welcome"><div><div class="eyebrow">Espace sécurisé · Maquette de navigation</div><h2>Bonjour, '+(activeRole==='admin'?'Administrateur':activeRole==='entreprise'?'Responsable entreprise':activeRole==='agence'?'Responsable agence':activeRole==='entrepot'?'Responsable entrepôt':activeRole==='prospecteur'?'Prospecteur':'Client')+' 👋</h2><p>'+esc(r.desc)+'<br>Les données visibles sont des exemples d’interface, pas des données de production.</p></div><button class="btn" onclick="go(\''+r.actions[0][2]+'\')">＋ Nouvelle action</button></div><div class="grid stats">'+r.stats.map(s=>'<div class="card"><div class="stat-top"><span>'+esc(s[0])+'</span><span class="stat-icon">'+s[3]+'</span></div><div class="stat-value">'+esc(s[1])+'</div><div class="stat-foot">'+esc(s[2])+'</div></div>').join('')+'</div><div class="grid columns"><section class="card"><div class="section-head"><div><h3>Activité récente</h3><p class="sub">Exemples de lignes pour visualiser la densité et les statuts.</p></div><button class="filter" onclick="notify(\'Le filtre sera connecté aux données réelles pendant le développement.\')">30 derniers jours ▾</button></div>'+table(samples[activeRole==='admin'?'users':activeRole==='entreprise'?'orders':activeRole==='agence'?'portfolio':activeRole==='entrepot'?'history':activeRole==='prospecteur'?'prospects':'requests'])+'</section><section class="card"><h3>Actions rapides</h3><p class="sub">Raccourcis propres à votre rôle.</p><div class="list">'+r.actions.map(a=>'<div class="item"><div class="item-icon">↗</div><div><strong>'+esc(a[0])+'</strong><small>'+esc(a[1])+'</small></div><button class="filter" onclick="go(\''+a[2]+'\')">Ouvrir</button></div>').join('')+'</div><div class="notice" style="margin-top:16px;margin-bottom:0">🔐 Les accès réels doivent être filtrés côté serveur et par les politiques RLS de Supabase.</div></section></div><div class="grid quick">'+r.actions.map(a=>'<button onclick="go(\''+a[2]+'\')"><span class="stat-icon">＋</span><span><b>'+esc(a[0])+'</b><small>'+esc(a[1])+'</small></span></button>').join('')+'</div>'}
function table(data){if(!data||!data.rows)return '<div class="empty">Aucune donnée de démonstration pour cet écran.</div>';return '<div class="table-wrap"><table><thead><tr><th>Référence</th><th>Élément</th><th>Détail</th><th>Statut</th></tr></thead><tbody>'+data.rows.map(row=>'<tr>'+row.map((v,i)=>'<td>'+(i===3?statusTag(v):esc(v))+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function genericPage(id){const d=samples[id]||{title:roles[activeRole].nav.find(n=>n[2]===id)?.[0]||'Page de module',intro:'Écran proposé dans la maquette générale. Le comportement exact et les champs seront confirmés pendant l’audit métier.',rows:[]};let body=d.form?'<div class="notice">Formulaire de démonstration. Aucun enregistrement n’est envoyé à la base depuis cette maquette.</div><div class="form-grid">'+(id==='newprospect'?[['Nom complet','Nom du prospect'],['Téléphone','+229 …'],['Source','Terrain / recommandation'],['Prochaine relance','JJ/MM/AAAA'],['Besoin exprimé','Description du besoin'],['Consentement','À confirmer']]:[['Nom complet','Nom et prénom'],['E-mail','nom@exemple.com'],['Téléphone','+229 …'],['Organisation','Nom de l’organisation']]).map(f=>'<div class="field"><label>'+esc(f[0])+'</label><input placeholder="'+esc(f[1])+'"></div>').join('')+'</div><div class="page-actions"><button class="btn" onclick="notify(\'Prototype uniquement : aucune donnée n’a été enregistrée.\')">Enregistrer (démo)</button><button class="btn ghost" onclick="go(\'overview\')">Annuler</button></div>':(d.rows?table(d):'<div class="empty">Cette page est prévue dans le parcours. Les champs et actions seront spécifiés avant intégration.</div>');return '<div class="welcome"><div><div class="eyebrow">'+esc(roles[activeRole].label)+'</div><h2>'+esc(d.title)+'</h2><p>'+esc(d.intro)+'</p></div><button class="btn ghost" onclick="go(\'overview\')">← Retour au tableau de bord</button></div><div class="page-panel"><div class="section-head"><div><h3>'+esc(d.title)+'</h3><p class="sub">Vue détaillée · navigation de démonstration</p></div><button class="filter" onclick="notify(\'Recherche à connecter aux données réelles.\')">⌕ Rechercher</button></div>'+body+'</div><div class="footer-note">À intégrer : chargement, état vide, erreur réseau, contrôle d’accès, validation formulaire, confirmation d’action et journalisation.</div>'}
function render(){navRender();const r=roles[activeRole];const d=samples[activePage];document.getElementById('topTitle').textContent=activePage==='overview'?'Vue d’ensemble':(d?.title||r.nav.find(n=>n[2]===activePage)?.[0]||'Espace de travail');document.getElementById('content').innerHTML=activePage==='overview'?dashboard():genericPage(activePage)}
function go(id){activePage=id;render();window.scrollTo({top:0,behavior:'smooth'})}
function notify(msg){let n=document.getElementById('toast');if(!n){n=document.createElement('div');n.id='toast';n.style.cssText='position:fixed;right:20px;bottom:20px;z-index:10;max-width:360px;background:#142744;color:white;padding:14px 18px;border-radius:12px;box-shadow:0 10px 30px #0002;font-size:12px';document.body.appendChild(n)}n.textContent=msg;n.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>n.style.display='none',3200)}
const sel=document.getElementById('role');sel.innerHTML=Object.entries(roles).map(([k,v])=>'<option value="'+k+'">'+esc(v.label)+'</option>').join('');sel.addEventListener('change',()=>{activeRole=sel.value;activePage='overview';render()});render();
</script></body></html>
